{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="card narrow" aria-labelledby="h">
  <h1 id="h">Change password</h1>
  {% if errors %}<div class="alert" role="alert" data-focus tabindex="-1"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <div class="field"><label for="cp">Current password</label>
      <input id="cp" name="current_password" type="password" autocomplete="current-password" required maxlength="257"></div>
    <div class="field"><label for="np">New password</label>
      <p class="help" id="np-h">At least the minimum length set by your administrator; must not contain your username.</p>
      <input id="np" name="new_password" type="password" autocomplete="new-password" required maxlength="257" aria-describedby="np-h"></div>
    <div class="field"><label for="cf">Confirm new password</label>
      <input id="cf" name="confirm_password" type="password" autocomplete="new-password" required maxlength="257"></div>
    <button class="btn btn-primary" type="submit">Change password</button>
  </form>
</section>
{% endblock %}
