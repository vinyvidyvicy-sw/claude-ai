{# Generic line icons drawn for this portal (not vendor logos). Decorative: the platform name is always next to them. #}
{% macro icon(name, size=28) -%}
<span class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
{%- if name == 'shield' -%}
  <path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == 'fabric' -%}
  <circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><circle cx="12" cy="12" r="2"/>
  <path d="M7.5 7.5l3 3M16.5 7.5l-3 3M7.5 16.5l3-3M16.5 16.5l-3-3"/>
{%- elif name == 'cube' -%}
  <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>
{%- elif name == 'switch-dc' -%}
  <rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/>
  <path d="M7 7h.01M7 17h.01M11 7h.01M11 17h.01M15 7h.01M15 17h.01"/>
{%- elif name == 'switch-campus' -%}
  <rect x="3" y="10" width="18" height="8" rx="1.5"/><path d="M7 14h.01M10 14h.01M13 14h.01M16 14h.01M12 10V6M9 8.5a4.2 4.2 0 0 1 6 0"/>
{%- elif name == 'search-shield' -%}
  <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h2l1-2 2 4 1-2h1"/>
{%- elif name == 'server-stack' -%}
  <path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5M3 16.5l9 4.5 9-4.5"/>
{%- elif name == 'wifi' -%}
  <path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.8 16a5 5 0 0 1 6.4 0"/><circle cx="12" cy="19.5" r="1"/>
{%- elif name == 'sparkles' -%}
  <path d="M10 3l1.8 4.7L16.5 9.5l-4.7 1.8L10 16l-1.8-4.7L3.5 9.5l4.7-1.8z"/><path d="M18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z"/>
{%- elif name == 'meeting' -%}
  <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><circle cx="9" cy="14" r="1.5"/><circle cx="15" cy="14" r="1.5"/><path d="M6.5 19c.3-1.6 1.4-2.5 2.5-2.5s2.2.9 2.5 2.5M12.5 19c.3-1.6 1.4-2.5 2.5-2.5s2.2.9 2.5 2.5"/>
{%- elif name == 'rocket' -%}
  <path d="M12 3c3 2 5 5.5 5 9l-2 3H9l-2-3c0-3.5 2-7 5-9z"/><circle cx="12" cy="10" r="1.5"/><path d="M9 15l-3 2v3l3-1.5M15 15l3 2v3l-3-1.5M12 17v4"/>
{%- elif name == 'document' -%}
  <path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h4"/>
{%- elif name == 'bulb' -%}
  <path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>
{%- else -%}
  <rect x="4" y="4" width="16" height="16" rx="3"/>
{%- endif -%}
</svg></span>
{%- endmacro %}
