# Teks dari dokumen PDF "Metrodata_AI_Use_Case.pdf", disalin apa adanya (bahasa Inggris; tidak diringkas, tidak
# diterjemahkan, tidak ditambah). Hanya klaim yang tertulis di dokumen yang dimasukkan di sini.
# Struktur mengikuti bentuk slide di PDF: kind: blueprint (tujuh bagian) dan kind: flow (jalur PEOPLE/AI/AUTOMATION).
# Pada slide flow, `col` adalah kolom tahap tempat langkah itu diletakkan di slide (hanya tata letak).
# Sengaja tidak dimasukkan (atas permintaan): "Agentic procurement document processing" (hal. 2, 11, 12);
# kartu joint-planning-session dan go-to-market dilewati.
# Pada slide flow, `arrow` (up/down) adalah panah emas pada langkah itu (hanya tata letak).
document: Metrodata_AI_Use_Case.pdf
cases:
  banking-trade-finance-document-examination:
    pdf_title: Trade finance document examination
    pages: 2, 3, 4
    overview:
      One-line description: Reads every page of a trade document set, checks it against the credit terms and the bank's rules, and explains each finding.
      Industry: Banking, 2026
      Runs on: Dataiku and Amazon Bedrock, hybrid
      Timeline: 2 months, one use case
      Level: Level 2
    blocks:
    - kind: blueprint
      page: 3
      title: Banking, trade finance document examination
      subtitle: Dataiku on the bank's servers with Amazon Bedrock in AWS Jakarta, a 2 month project, in the seven blueprint sections
      problem:
        owner: 'Owner: Trade operations, with the checkers'
        items:
        - Every document set examined by hand, page by page
        - Fields compared across documents and the credit terms
        - Each discrepancy written up with its page and article
        - Parties and prices checked one by one
      solution:
        heading: One examination run for every new document set
        text: Each page is read once, the fields are examined against the credit terms and the bank's rules, and every finding is explained. Checkers accept, overrule and sign.
        does_label: WHAT IT DOES
        does:
        - Reads every page, its document and fields
        - Examines the set against the bank's rules
        - Explains each finding and drafts the notice
      trust:
        level: Level 2
        caption: Prepares, you decide
        items:
        - The checker accepts or overrules each finding
        - Trade compliance reviews flagged parties
        - Trade operations honours or sends the refusal
      readiness:
      - Sample document sets with past findings
      - The bank's matching rules and SOPs
      - Three Linux VMs on the bank's servers
      - Private network from the bank to AWS Jakarta
      architecture:
      - title: Document sets land in the to check folder
        chips:
        - Document set PDF
        - Credit terms and rules
      - title: Dataiku Automation node on the bank's servers
        chips:
        - Render every page
        - Check every field
      - title: AI reads, examines and explains
        chips:
        - Amazon Bedrock Jakarta
        - Findings and notice
      - title: Automation screens and sorts the result
        chips:
        - Parties and prices
        - Clean or corrections
      - title: Checker decision and the process log
        chips:
        - Accept, overrule, sign
        - Write once log
      impact:
      - Target of two minutes or less per set
      - Every finding shown with its page and reason
      - Checkers review findings, not every page
      effort:
        big: 2 months
        small: one use case, network and AI teams
      roadmap:
      - Phase 1, discovery, FSD and design approval
      - Phase 2, AWS network, Dataiku and the build
      - Phase 3, SIT, UAT and handover
    - kind: flow
      page: 4
      title: Banking, the document examination flow
      subtitle: The high level solution as lanes, from a new document set to the checker's signature and the process log
      stages:
      - num: '01'
        name: Receive
      - num: '02'
        name: Read
      - num: '03'
        name: Verify
      - num: '04'
        name: Examine
      - num: '05'
        name: Decide
      - num: '06'
        name: Close
      lanes:
      - key: PEOPLE
        sub: Trade ops, checker, compliance
        steps:
        - n: 1
          text: Trade operations drops the document set in, or the trade system sends it
          col: 1
        - n: 6
          text: Trade compliance reviews any party or price that was flagged
          col: 3
        - n: 9
          text: The checker opens it, accepts or overrules each finding, and signs
          col: 5
        - n: 10
          text: Trade operations honours or sends the refusal
          col: 6
      - key: AI
        sub: Reads, examines, explains
        steps:
        - n: 3
          text: 'The AI reads each page once: the document it belongs to, and every field'
          col: 2
          arrow: down
        - n: 7
          text: The AI examines the documents against the rules, explains each finding and drafts the notice
          col: 4
      - key: AUTOMATION
        sub: Folders, checks, the record
        steps:
        - n: 2
          text: A new file starts the run, and every page is rendered as an image
          col: 1
        - n: 4
          text: Pages are grouped into documents, and each field is checked against its page
          col: 2
        - n: 5
          text: Parties are screened and prices checked against the market
          col: 3
        - n: 8
          text: The document set lands in out / clean, or in out / corrections
          col: 5
        - n: 11
          text: Every decision, override and source is written to the process log
          col: 6
  banking-customer-analytics-credit-scoring:
    pdf_title: Customer analytics and credit scoring
    pages: 2, 5, 6
    overview:
      One-line description: 'Five models on one platform: customer segments, churn risk, offers for civil servants, customer profitability and credit scores.'
      Industry: Banking, 2026
      Runs on: Dataiku, hybrid
      Timeline: 7 months, five models
      Level: Level 2
    blocks:
    - kind: blueprint
      page: 5
      title: Banking, customer analytics and credit scoring
      subtitle: Five models on Dataiku in a hybrid setup, a 7 month project that started in September 2026, in the seven blueprint sections
      problem:
        owner: 'Owner: Business and credit units, with IT'
        items:
        - Which customers belong together, and why
        - Which customers will go dormant or close their account
        - Which product to offer each civil servant
        - Fee and interest income and credit risk per customer
      solution:
        heading: Five models on one Dataiku platform
        text: Customer and transaction history feed five models that segment customers, flag churn, suggest offers, estimate profitability and score credit. Teams act on the scores.
        does_label: WHAT IT DOES
        does:
        - Segment and churn risk per customer
        - Next offer and profitability per customer
        - Credit score per civil servant debtor
      trust:
        level: Level 2
        caption: Prepares, you decide
        items:
        - Business teams decide who gets which offer
        - Credit officers decide every application
        - Risk and IT approve each model release
      readiness:
      - Customer and account data in one place
      - Transaction history for every customer
      - Loan and repayment history for scoring
      - Dataiku in a hybrid setup
      architecture:
      - title: Customer, account and transaction data
        chips:
        - Core banking data
        - Loan history
      - title: Data preparation in Dataiku
        chips:
        - Clean and join
        - Features per customer
      - title: AI models score every customer
        chips:
        - Segment and churn
        - Offer, profit, credit
      - title: Automation refreshes data and scores
        chips:
        - Scheduled runs
        - Scores to the teams
      - title: Decisions and model monitoring
        chips:
        - Offers and loans
        - Model performance
      impact:
      - Offers matched to each customer segment
      - Churn risk seen before an account closes
      - Credit decisions backed by one score
      effort:
        big: 7 months
        small: five models, started September 2026
      roadmap:
      - Phase 1, customer data prepared in Dataiku
      - Phase 2, the five models built and tested
      - Phase 3, scores in use and monitored
    - kind: flow
      page: 6
      title: Banking, the customer analytics flow
      subtitle: The high level solution as lanes, from customer data to the scores that business and credit teams act on
      stages:
      - num: '01'
        name: Collect
      - num: '02'
        name: Prepare
      - num: '03'
        name: Segment
      - num: '04'
        name: Offer
      - num: '05'
        name: Credit
      - num: '06'
        name: Monitor
      lanes:
      - key: PEOPLE
        sub: Business, credit and risk teams
        steps:
        - n: 4
          text: Business teams review the segments and the churn list
          col: 3
        - n: 6
          text: Business teams choose which offers go to whom
          col: 4
        - n: 8
          text: Credit officers decide each application with the score
          col: 5
        - n: 10
          text: Risk and IT review model performance and approve changes
          col: 6
      - key: AI
        sub: Segments, predicts, scores
        steps:
        - n: 3
          text: Customers grouped into segments and scored for churn risk
          col: 3
          arrow: up
        - n: 5
          text: Next offer and profitability estimated for each customer
          col: 4
          arrow: up
        - n: 7
          text: Credit score calculated for each civil servant debtor
          col: 5
          arrow: up
      - key: AUTOMATION
        sub: Loads, prepares, refreshes
        steps:
        - n: 1
          text: Customer, account and transaction data loaded into Dataiku
          col: 1
        - n: 2
          text: Data cleaned, joined and turned into features per customer
          col: 2
        - n: 9
          text: Scheduled runs refresh the data and the scores
          col: 6
  manufacturing-predictive-maintenance:
    pdf_title: Predictive maintenance for machines
    pages: 2, 7, 8
    overview:
      One-line description: Predicts which machine is likely to fail from its machine data, so maintenance can act before a breakdown stops the line.
      Industry: Manufacturing, 2024
      Runs on: Amazon SageMaker, cloud
      Timeline: 5 months, one use case
      Level: Level 2
    blocks:
    - kind: blueprint
      page: 7
      title: Manufacturing, predictive maintenance for machines
      subtitle: Amazon SageMaker in the cloud, a 5 month project from November 2024, in the seven blueprint sections
      problem:
        owner: 'Owner: Maintenance, with production'
        items:
        - Machines that fail without warning and stop the line
        - Service done by the calendar, not by condition
        - Spare parts and crews arranged after the stop
        - Little time to plan a repair before a failure
      solution:
        heading: Failure prediction from machine data
        text: Machine data feeds a model on Amazon SageMaker that predicts which machine is likely to fail, so maintenance can plan the repair before the line stops.
        does_label: WHAT IT DOES
        does:
        - Collects and prepares the machine data
        - Predicts the risk of failure per machine
        - Warns maintenance before a breakdown
      trust:
        level: Level 2
        caption: Prepares, you decide
        items:
        - Maintenance decides every repair
        - Production agrees any planned stop
        - Engineers review the model before changes
      readiness:
      - Machine sensor readings over time
      - Failure and repair history per machine
      - A cloud data store on AWS
      - A secure link from the plant to AWS
      architecture:
      - title: Machine data from the line
        chips:
        - Sensor readings
        - Repair history
      - title: Secure link from the plant to AWS
        chips:
        - Data upload
        - Cloud storage
      - title: AI predicts the risk of failure
        chips:
        - Trained on SageMaker
        - Scores new data
      - title: Automation sends the warning
        chips:
        - Risk per machine
        - Alert to maintenance
      - title: Repair decision and the record
        chips:
        - Planned repair
        - Model monitoring
      impact:
      - Repairs planned before a breakdown
      - Fewer unplanned stops on the line
      - Spare parts and crews ready in time
      effort:
        big: 5 months
        small: one use case, from November 2024
      roadmap:
      - Phase 1, machine data connected and prepared
      - Phase 2, failure model trained and tested
      - Phase 3, warnings to maintenance, then monitoring
    - kind: flow
      page: 8
      title: Manufacturing, the predictive maintenance flow
      subtitle: The high level solution as lanes, from machine data to a planned repair before the line stops
      stages:
      - num: '01'
        name: Collect
      - num: '02'
        name: Learn
      - num: '03'
        name: Predict
      - num: '04'
        name: Plan and repair
      - num: '05'
        name: Record
      lanes:
      - key: PEOPLE
        sub: Maintenance and production
        steps:
        - n: 6
          text: Maintenance plans the repair, parts and crew with production
          col: 4
      - key: AI
        sub: Learns, predicts
        steps:
        - n: 3
          text: Failure model trained on the prepared history
          col: 2
        - n: 4
          text: New readings scored for the risk of failure
          col: 3
          arrow: down
        - n: 8
          text: The model retrained as new failures are recorded
          col: 5
      - key: AUTOMATION
        sub: Collects, warns, records
        steps:
        - n: 1
          text: Sensor readings from each machine sent to the cloud
          col: 1
        - n: 2
          text: Readings cleaned and joined with the repair history
          col: 2
          arrow: up
        - n: 5
          text: A warning sent when a machine's risk is high
          col: 3
        - n: 7
          text: Each repair recorded and added to the history
          col: 5
          arrow: up
  manufacturing-realtime-component-inspection:
    pdf_title: Real time car component inspection; Manufacturing, real time component inspection
    pages: 2, 9, 10
    overview:
      One-line description: Checks every component image from the line camera in real time and flags the parts that need attention.
      Industry: Manufacturing, 2023
      Runs on: Amazon SageMaker, cloud
      Timeline: 4 months, with predictive maintenance on two lines
      Level: Level 2
    blocks:
    - kind: blueprint
      page: 9
      title: Manufacturing, real time component inspection
      subtitle: Amazon SageMaker in the cloud, a 4 month project from December 2023 that also covered predictive maintenance on two lines
      problem:
        owner: 'Owner: Quality, with production'
        items:
        - Components checked by eye on a moving line
        - Defects found late, after the next station
        - Results that differ between inspectors
        - No image record of what was checked
      solution:
        heading: Camera inspection with object detection
        text: A camera captures each component and an object detection model on Amazon SageMaker checks every image in real time. Operators act on the flagged parts.
        does_label: WHAT IT DOES
        does:
        - Captures every component on camera
        - Detects defects in each image in real time
        - Flags the parts that need attention
      trust:
        level: Level 2
        caption: Prepares, you decide
        items:
        - Operators confirm every flagged part
        - Quality decides on rework or scrap
        - Engineers review the model before changes
      readiness:
      - A camera at each inspection point
      - Labelled images of good and defective parts
      - Clear pass and fail criteria
      - A secure link from the line to AWS
      architecture:
      - title: Camera at the inspection point
        chips:
        - Image per component
        - Line and station
      - title: Secure link from the line to AWS
        chips:
        - Image upload
        - Cloud storage
      - title: AI detects defects in real time
        chips:
        - Trained on SageMaker
        - Checks each image
      - title: Automation marks the result
        chips:
        - Passed or flagged
        - Alert to the operator
      - title: Operator decision and the record
        chips:
        - Rework or scrap
        - Image record
      impact:
      - Every component checked the same way
      - Defects caught at the inspection point
      - An image record for every component
      effort:
        big: 4 months
        small: two use cases, from December 2023
      roadmap:
      - Phase 1, images collected and labelled
      - Phase 2, detection model trained and tested
      - Phase 3, real time inspection on the line
    - kind: flow
      page: 10
      title: Manufacturing, the inspection flow
      subtitle: The high level solution as lanes, from the camera image to the decision on each flagged part
      stages:
      - num: '01'
        name: Prepare
      - num: '02'
        name: Capture
      - num: '03'
        name: Detect
      - num: '04'
        name: Confirm
      - num: '05'
        name: Close
      lanes:
      - key: PEOPLE
        sub: Operators and quality
        steps:
        - n: 1
          text: Quality labels sample images of good and defective parts
          col: 1
          arrow: down
        - n: 6
          text: The operator checks each flagged part on the line
          col: 4
        - n: 7
          text: Quality decides on rework or scrap
          col: 5
      - key: AI
        sub: Learns, detects
        steps:
        - n: 2
          text: A detection model is trained on the labelled images
          col: 1
        - n: 4
          text: Each image is checked for defects in real time
          col: 3
          arrow: down
      - key: AUTOMATION
        sub: Captures, marks, records
        steps:
        - n: 3
          text: The line camera captures each component at the station
          col: 2
        - n: 5
          text: The component is marked as passed or flagged
          col: 3
        - n: 8
          text: The result and the image are stored for every component
          col: 5

# Penjelasan Level 1, 2 dan 3 (dari gambar lampiran "How much the system decides"); teks sama dengan gambar.
levels:
  caption: How much the system decides
  items:
    - number: 1
      name: Assist
      tagline: Answers, on demand
      text: The system answers questions from your policies and records. Your people make every decision and every change.
      icon: help
      steps:
        - {text: You ask, style: outline}
        - {text: It answers, style: solid}
        - {text: You decide, style: outline}
    - number: 2
      name: Accelerate
      tagline: Prepares, you decide
      text: The system ranks, drafts and warns, so the work arrives prepared. Your team decides what happens next.
      icon: chart
      steps:
        - {text: It prepares, style: solid}
        - {text: It warns, style: solid}
        - {text: You decide, style: outline}
    - number: 3
      name: Act
      tagline: Acts within your limits
      text: The system runs routine steps inside rules and approval limits you set, and reports every action. Your people set the limits and review.
      icon: gear
      steps:
        - {text: It acts, style: solid}
        - {text: It reports, style: solid}
        - {text: You review, style: outline}
