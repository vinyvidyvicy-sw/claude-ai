    description: Create an endpoint identity group on an ISE node.
    risk: low
    assumption: true
    notes:
      - "ASSUMPTION: sample workflow and parameters only. Backend and job (dispatch) are TODO until the ISE API and version are confirmed."
    parameters:
      - {name: device, label: ISE node, type: device, help: Choose the ISE node from the inventory.}
      - {name: group_name, label: Group name, type: string, pattern: '[A-Za-z0-9][A-Za-z0-9_ .-]{1,63}', pattern_hint: "2-64 characters: letters, digits, space, '.', '_' or '-'.", max_length: 64}
      - {name: description, label: Description, type: string, required: false, max_length: 200}
    plan:
      summary: "Create endpoint identity group '{group_name}' on {device}"
      steps:
        - id: create-group
          description: "Create endpoint identity group '{group_name}' (description: '{description}')"
          write: true
    dispatch:
      backend: TODO   # name of the registered automation backend
      job: TODO       # job/playbook/template id inside that backend

