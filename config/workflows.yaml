    description: Ask for a predictive Wi-Fi design (and later a validation survey) for a site, so the wireless team can plan access-point placement.
    risk: low
    assumption: true
    notes:
      - "ASSUMPTION: sample workflow and parameters only. What Ekahau actually needs (floor plans, requirements, project templates) and how the request is fulfilled are TODO. Backend and job (dispatch) are TODO."
