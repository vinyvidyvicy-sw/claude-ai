    interface_note: "Backend will likely use (UNCONFIRMED): Splunk REST API."
    version_note: "Splunk / ES version: TODO."
  esxi:
    name: VMware ESXi management
    summary: ESXi host management. TODO - confirm whether this means standalone ESXi hosts or vCenter.
