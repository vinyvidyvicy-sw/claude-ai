  ekahau:
    icon: wifi
    name: Ekahau Design
    summary: Survei dan desain Wi-Fi. Membuka lingkungan Ekahau yang di-host di VMware.
    launcher: true     # tile membuka alat eksternal; alamat https-nya diatur di config/inventory.yaml pada `launchers:`
    interface_note: "Portal hanya membuka Ekahau; tidak meneruskan kredensial. Login bawaan Ekahau berlaku. TODO: produk/versi Ekahau dan cara aksesnya (web, gateway remote desktop, lainnya)."
    version_note: "Produk dan versi Ekahau: TODO."

# Menu "Inovasi": tiap item membuka halaman eksternal. Alamat https-nya diatur di config/inventory.yaml
# pada `launchers:` dengan kunci yang sama dengan `id` di bawah. Khusus `use_cases`, `url:` di sini adalah alamat bawaan
# (harus https://); entri `launchers:` di inventory.yaml, jika ada, menggantikannya.
innovation:
  - id: metrodata-ai-use-case
    title: Metrodata AI Use Case
    icon: sparkles
    summary: "Dashboard penerapan AI (use case) Metrodata untuk kegiatan bisnis (perencanaan bersama, strategi pasar, dokumen pengadaan) serta use case perbankan dan manufaktur. Pilih salah satu dashboard di bawah."
    use_cases:
      - id: joint-planning-session
        title: Joint Planning Session
        url: https://metrodata-ai-jps.netlify.app
        icon: meeting
        assumption: true
        summary: "Menyiapkan dan memantau sesi perencanaan bersama dengan mitra atau principal: agenda, target, kesepakatan, dan tindak lanjut. AI membantu merangkum pembahasan dan menyoroti prioritas."
      - id: go-to-market
        title: Go To Market
        url: https://metrodata-ai-gtm.netlify.app
        icon: rocket
        assumption: true
        summary: "Memantau strategi Go To Market: segmen, penawaran, pipeline, dan progres kampanye. AI membantu menganalisis peluang dan menyusun rekomendasi langkah ke pasar."
      - id: document-procurement
        title: Document Procurement
        icon: document
        assumption: true
        summary: "Mengelola dokumen pengadaan: kelengkapan dokumen, status tinjauan, dan tenggat waktu. AI membantu memeriksa kelengkapan dan merangkum isi dokumen."
      - id: banking-trade-finance-document-examination
        title: Trade Finance Document Examination
        category: Banking
        icon: doc-check
        assumption: true
        summary: "Pemeriksaan dokumen trade finance (mis. L/C, invoice, bill of lading) di perbankan. AI membantu membaca dokumen, mencocokkan isinya dengan persyaratan, dan menandai ketidaksesuaian untuk ditinjau petugas."
      - id: banking-customer-analytics-credit-scoring
        title: Customer Analytics and Credit Scoring
        category: Banking
        icon: chart
        assumption: true
        summary: "Analitik nasabah dan penilaian kredit. AI membantu menyegmentasi nasabah, memperkirakan risiko kredit, dan memberi skor untuk mendukung keputusan pembiayaan."
      - id: manufacturing-predictive-maintenance
        title: Predictive Maintenance for Machines
        category: Manufacturing
        icon: gear
        assumption: true
        summary: "Pemeliharaan prediktif untuk mesin pabrik. AI memantau data sensor, memprediksi potensi kerusakan, dan menyarankan jadwal perawatan sebelum terjadi gangguan produksi."
      - id: manufacturing-realtime-component-inspection
        title: Real-time Component Inspection
        category: Manufacturing
        icon: scan
        assumption: true
        summary: "Inspeksi komponen secara real time di lini produksi. AI menganalisis gambar kamera untuk mendeteksi cacat komponen dan memberi peringatan langsung."
  - id: splunk-innovation
    title: Splunk Innovation
    icon: bulb
    summary: "Inovasi dan use case berbasis Splunk. TODO: konten dan alamat halaman belum diberikan."

workflows:
  - id: ise-create-endpoint-group
    platform: ise
    title: Buat endpoint identity group
    description: Membuat endpoint identity group pada node ISE.
    risk: low
    assumption: true
    notes:
      - "ASUMSI: hanya contoh workflow dan parameter. Backend dan job (dispatch) masih TODO sampai API dan versi ISE dikonfirmasi."
    parameters:
      - {name: device, label: Node ISE, type: device, help: Pilih node ISE dari inventaris.}
      - {name: group_name, label: Nama grup, type: string, pattern: '[A-Za-z0-9][A-Za-z0-9_ .-]{1,63}', pattern_hint: "2-64 karakter: huruf, angka, spasi, '.', '_' atau '-'.", max_length: 64}
      - {name: description, label: Deskripsi, type: string, required: false, max_length: 200}
    plan:
      summary: "Buat endpoint identity group '{group_name}' pada {device}"
      steps:
        - id: create-group
          description: "Buat endpoint identity group '{group_name}' (deskripsi: '{description}')"
          write: true
    dispatch:
      backend: TODO   # nama backend otomasi yang terdaftar
      job: TODO       # id job/playbook/template di dalam backend itu

  - id: sda-create-virtual-network
    platform: sda
    title: Buat virtual network
    description: Membuat virtual network (VN) pada fabric SDA.
    risk: medium
    assumption: true
    notes:
      - "ASUMSI: hanya contoh workflow dan parameter. Backend dan job (dispatch) masih TODO sampai API dan versi Catalyst Center dikonfirmasi."
    parameters:
      - {name: device, label: Catalyst Center, type: device}
      - {name: vn_name, label: Nama virtual network, type: string, pattern: '[A-Za-z][A-Za-z0-9_-]{1,31}', pattern_hint: "2-32 karakter: diawali huruf; huruf, angka, '_' atau '-'.", max_length: 32}
    plan:
      summary: "Buat virtual network '{vn_name}' melalui {device}"
      steps:
        - id: create-vn
          description: "Buat virtual network '{vn_name}'"
          write: true
    dispatch:
      backend: TODO
      job: TODO

  - id: aci-create-tenant
    platform: aci
    title: Buat tenant
    description: Membuat tenant pada klaster APIC.
    risk: medium
    assumption: true
    notes:
      - "ASUMSI: hanya contoh workflow dan parameter. Backend dan job (dispatch) masih TODO sampai API dan versi APIC dikonfirmasi."
    parameters:
      - {name: device, label: APIC, type: device}
      - {name: tenant_name, label: Nama tenant, type: string, pattern: '[A-Za-z0-9][A-Za-z0-9_.-]{0,63}', pattern_hint: "1-64 karakter: huruf, angka, '_', '.' atau '-'.", max_length: 64}
      - {name: description, label: Deskripsi, type: string, required: false, max_length: 128}
    plan:
      summary: "Buat tenant '{tenant_name}' pada {device}"
      steps:
        - id: create-tenant
          description: "Buat tenant '{tenant_name}'"
          write: true
    dispatch:
      backend: TODO
      job: TODO

  - id: nxos-create-vlan
    platform: nxos
    title: Buat VLAN
    description: Membuat VLAN pada switch NX-OS.
    risk: low
    assumption: true
    notes:
      - "ASUMSI: contoh workflow. Rentang VLAN yang dicadangkan untuk versi NX-OS target masih TODO; rentang 2-3967 di bawah hanya placeholder. Backend dan job (dispatch) masih TODO sampai NX-API atau RESTCONF dipilih."
    parameters:
      - {name: device, label: Switch, type: device}
      - {name: vlan_id, label: ID VLAN, type: int, min: 2, max: 3967, help: "Rentang placeholder; TODO konfirmasi VLAN yang dicadangkan."}
      - {name: vlan_name, label: Nama VLAN, type: string, pattern: '[A-Za-z0-9_-]{1,32}', pattern_hint: "1-32 karakter: huruf, angka, '_' atau '-'.", max_length: 32}
    plan:
      summary: "Buat VLAN {vlan_id} ('{vlan_name}') pada {device}"
      steps:
        - id: create-vlan
          description: "Buat VLAN {vlan_id} dengan nama '{vlan_name}'"
          write: true
    dispatch:
      backend: TODO
      job: TODO

  - id: catalyst-set-access-port
    platform: catalyst
    title: Konfigurasi access port
    description: Mengatur access VLAN dan deskripsi pada interface switch Catalyst.
    risk: medium
    assumption: true
    notes:
      - "ASUMSI: contoh workflow. Pola nama interface hanya placeholder. Backend dan job (dispatch) masih TODO sampai RESTCONF atau NETCONF dipilih."
    parameters:
      - {name: device, label: Switch, type: device}
      - {name: interface, label: Interface, type: string, pattern: '[A-Za-z]+[0-9]+(/[0-9]+){0,3}', pattern_hint: "Contoh: GigabitEthernet1/0/1 (pola placeholder).", max_length: 40}
      - {name: vlan_id, label: Access VLAN, type: int, min: 1, max: 4094}
      - {name: port_description, label: Deskripsi port, type: string, required: false, pattern: '[ -~]{0,80}', pattern_hint: "ASCII yang dapat dicetak, hingga 80 karakter.", max_length: 80}
    plan:
      summary: "Atur {interface} pada {device} ke access VLAN {vlan_id}"
      steps:
        - id: set-port
          description: "Pada {interface}: access VLAN {vlan_id}, deskripsi '{port_description}'"
          write: true
    dispatch:
      backend: TODO
      job: TODO

  - id: splunk-toggle-correlation-search
    platform: splunk
    title: Aktifkan atau nonaktifkan correlation search
    description: Mengaktifkan atau menonaktifkan correlation search tertentu di Splunk Enterprise Security.
    risk: high
    assumption: true
    notes:
      - "ASUMSI: contoh workflow. Menonaktifkan deteksi mengurangi cakupan pemantauan; pertimbangkan persetujuan dari orang kedua (TODO). Backend dan job (dispatch) masih TODO sampai versi Splunk/ES dikonfirmasi."
    parameters:
      - {name: device, label: Search head Splunk, type: device}
      - {name: search_name, label: Nama correlation search, type: string, pattern: '[ -~]{3,150}', pattern_hint: "ASCII yang dapat dicetak, 3-150 karakter.", max_length: 150}
      - name: state
        label: Status yang diinginkan
        type: enum
        choices: [{value: enabled, label: Aktif}, {value: disabled, label: Nonaktif}]
    plan:
      summary: "Atur correlation search '{search_name}' menjadi {state} pada {device}"
      steps:
        - id: toggle-search
          description: "Atur correlation search '{search_name}' menjadi {state}"
          write: true
    dispatch:
      backend: TODO
      job: TODO

  - id: esxi-enter-maintenance-mode
    platform: esxi
    title: Masuk maintenance mode
    description: Memasukkan host ESXi ke maintenance mode.
    risk: high
    assumption: true
    notes:
      - "ASUMSI: contoh workflow. Penerapan untuk ESXi mandiri vs vCenter masih TODO. Backend dan job (dispatch) masih TODO sampai API dan versi vSphere dikonfirmasi."
    parameters:
      - {name: device, label: Host ESXi, type: device}
      - {name: timeout_seconds, label: Batas waktu (detik), type: int, min: 60, max: 7200, default: 600}
      - {name: evacuate_powered_off_vms, label: Evakuasi juga VM yang mati, type: bool, required: false}
    plan:
      summary: "Masuk maintenance mode pada {device} (batas waktu {timeout_seconds} detik)"
      steps:
        - id: enter-maintenance
          description: "Masuk maintenance mode pada {device}, batas waktu {timeout_seconds} detik, evakuasi VM yang mati: {evacuate_powered_off_vms}"
          write: true
    dispatch:
      backend: TODO
      job: TODO
