# Workflow catalogue. Add workflows here; no code changes needed.
#
# This portal is a FRONT END. It never connects to devices and holds no device credentials.
# Each workflow's `dispatch` block names the automation backend and the job that performs the
# change after an engineer previews and confirms the request:
#     dispatch: {backend: <registered backend name>, job: <job id in that backend>, payload: {...}}
#   * `backend`/`job` = TODO means the hand-off is not defined yet; such a workflow refuses to run live.
#   * `payload` is optional; when omitted, all validated parameters are sent as-is (typed).
#     When given, "{name}" placeholders are filled from the parameters.
# Other rules (a bad file stops the portal with a list of problems):
#   * parameters never hold secrets (names like password/token/secret/community are rejected);
#   * `plan.steps` are human-readable preview lines only; they are not executed by the portal.
#
# EVERY workflow below is an ASSUMPTION: the real workflow list has not been provided.
schema_version: 1

platforms:
