# Katalog workflow. Tambahkan workflow di sini; tidak perlu mengubah kode.
#
# Portal ini adalah FRONT END. Portal tidak pernah terhubung ke perangkat dan tidak menyimpan kredensial perangkat.
# Blok `dispatch` pada tiap workflow menyebut backend otomasi dan job yang melakukan perubahan setelah engineer
# melihat pratinjau dan mengonfirmasi:
#     dispatch: {backend: <nama backend terdaftar>, job: <id job di backend itu>, payload: {...}}
#   * `backend`/`job` = TODO berarti penyerahan belum ditentukan; workflow itu menolak berjalan secara live.
#   * `payload` opsional; jika dihilangkan, semua parameter yang valid dikirim apa adanya (bertipe).
#     Jika diisi, placeholder "{nama}" diisi dari parameter.
# Aturan lain (file yang salah menghentikan portal saat start dan menampilkan daftar masalah):
#   * parameter tidak boleh berisi rahasia (nama seperti password/token/secret/community ditolak);
#   * `plan.steps` hanya baris pratinjau yang mudah dibaca; portal tidak menjalankannya.
#
# SEMUA workflow di bawah adalah ASUMSI (ASSUMPTION): daftar workflow yang sebenarnya belum diberikan.
schema_version: 1

platforms:
  ise:
    icon: shield
    name: Cisco ISE
    summary: Layanan identitas dan kebijakan.
    interface_note: "Backend kemungkinan memakai (BELUM DIKONFIRMASI): ISE ERS / OpenAPI."
