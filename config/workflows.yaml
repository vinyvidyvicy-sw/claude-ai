    version_note: "Versi APIC: TODO."
  nxos:
    icon: switch-dc
    name: Cisco NX-OS switches
    summary: Switch Nexus untuk data center.
    interface_note: "Backend kemungkinan memakai (BELUM DIKONFIRMASI): NX-API atau RESTCONF."
    version_note: "Versi NX-OS: TODO."
  catalyst:
    icon: switch-campus
    name: Cisco Catalyst switches (IOS-XE)
    summary: Switch campus Catalyst yang menjalankan IOS-XE.
    interface_note: "Backend kemungkinan memakai (BELUM DIKONFIRMASI): RESTCONF atau NETCONF."
    version_note: "Versi IOS-XE: TODO."
  splunk:
    icon: search-shield
    name: Splunk Enterprise Security
    summary: Pemantauan keamanan pada Splunk Enterprise Security.
    interface_note: "Backend kemungkinan memakai (BELUM DIKONFIRMASI): Splunk REST API."
    version_note: "Versi Splunk / ES: TODO."
  esxi:
    icon: server-stack
    name: VMware ESXi management
    summary: Manajemen host ESXi. TODO - konfirmasi apakah yang dimaksud host ESXi mandiri atau vCenter.
    interface_note: "Backend kemungkinan memakai (BELUM DIKONFIRMASI): vSphere API."
