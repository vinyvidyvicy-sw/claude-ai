# Device inventory. Copy to config/inventory.yaml (git-ignored) and edit.
# ASSUMPTION: names and addresses below are placeholders (192.0.2.0/24 is the documentation range).
# The portal never logs in to devices and stores no device credentials: the automation backend does.
# `address` is informational (shown to engineers and passed to the backend as the target).
# Optional `console_url` (must be https://) adds an "Open console" link to the platform page, e.g.
#   console_url: https://<host-of-the-platform-console>
devices:
  - {name: ise-lab-1,    platform: ise,      address: 192.0.2.10}
  - {name: dnac-lab-1,   platform: sda,      address: 192.0.2.11}
  - {name: apic-lab-1,   platform: aci,      address: 192.0.2.12}
  - {name: nxos-lab-1,   platform: nxos,     address: 192.0.2.13}
  - {name: cat-lab-1,    platform: catalyst, address: 192.0.2.14}
  - {name: splunk-lab-1, platform: splunk,   address: 192.0.2.15}
  - {name: esxi-lab-1,   platform: esxi,     address: 192.0.2.16}

