# /etc/nginx/sites-available/portal  ->  ganti PORTAL_HOST dengan nama DNS atau IP VM (mis. portal.lab.local)
server {
    listen 80;
    server_name PORTAL_HOST;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name PORTAL_HOST;

    ssl_certificate     /etc/ssl/portal/portal.crt;
    ssl_certificate_key /etc/ssl/portal/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
